[project]
name = "citibike-demand-course-project"
version = "0.1.0"
description = "Reproducible Citi Bike station demand and availability data pipeline"
requires-python = ">=3.12"
dependencies = [
  "duckdb==2.0.0",
  "pandas==3.1.1",
  "pyarrow==26.0.1",
  "requests==2.34.2",
  "tenacity==9.2.1",
  "osmnx==2.1.2",
  "scikit-learn==1.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

